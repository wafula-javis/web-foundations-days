<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notes Draft</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Notes Draft</h1>
 
  <label for="note-text">Your note:</label>
  <textarea id="note-text" rows="8"></textarea>
 
  <p id="char-count">0 / 200 characters</p>
  <p id="word-count">0 words</p>
 
  <button id="clear-btn">Clear</button>
  <button id="theme-toggle">Dark mode</button>
</body>
</html>
